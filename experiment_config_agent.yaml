# ============================================================================
# 智能体(Agent)专用评测配置
# 用法:python run_eval.py --experiment-config experiment_config_agent.yaml
# 与 experiment_config.yaml 的区别:这里 predictor 固定为 agent,走本地黑盒 HTTP 服务,
# 忽略 protocol,采样/多轮/工具全部由 agent 内部决定,repeats 固定 1。
# 提交逻辑:参赛方仓库拉取到 agents/<仓库名>/(含 solution.py),框架本地启动评测。
# 对接说明见 docs/agent_eval.md,内部实现见 docs/agent_eval_plan.md。
# ============================================================================

# llm 段:我们部署的「统一 model 后端」。这组凭证(api_url/api_key/model_name)会随每条
# /predict 请求体的 model 字段下发给 agent,供其调用模型;所有参赛 agent 用同一个 model。
llm:
  model_name: <your-model-name>          # 统一模型名(所有参赛 agent 相同)
  api_key: <your-api-key>                 # 我们部署后端的 api key
  api_url: <your-api-base-url>            # 我们部署后端的 OpenAI 兼容地址,如 https://.../v1
  max_workers: 16

# agent 模式下 protocol 被忽略,仅为占位保留(非 agent 时才生效)。
protocol: direct

# 关键开关:predictor=agent 切换到智能体评测(本地黑盒 HTTP 服务)。
predictor: agent

agent:
  # runtime:怎么把统一运行时(agents/server.py)跑起来。
  #   local (默认)  —— subprocess 直接起 python agents/server.py,依赖跑在评测机本机环境,最轻量。
  #   docker         —— 把参赛方仓库连同环境构建成镜像,再叠加我方 server.py 当 ENTRYPOINT 跑容器;
  #                     环境彻底交给参赛方(交 Dockerfile 或 requirements.txt),契约/并发/错误兜底仍是我方。
  # 两种模式契约完全一致,只是「怎么起 server」不同。切 docker 需评测机装好 docker(colima/Desktop)。
  runtime: local
  # solution_dir(必填):参赛方仓库根目录(含 solution.py)。提交逻辑是把参赛方仓库拉到
  #   agents/ 下,这里指向它即可。local 模式作为 SOLUTION_DIR;docker 模式作为镜像构建上下文
  #   (其 Dockerfile / requirements.txt 决定环境)。
  solution_dir: agents/template
  api_url: http://127.0.0.1:8100  # 本地 server 监听地址;端口(8100)会解析出来:local 传给 PORT,docker 映射到容器 8100
  predict_path: /predict          # 端点路径,拼在 api_url 后
  request_timeout: 60             # 单次 HTTP 请求超时(秒)
  predict_timeout: 300            # 单条样本含所有重试的总超时(秒)
  max_retry: 2                    # 单条 /predict 失败重试次数
  max_workers: 16                 # 我们并发发题给 agent 的线程数
  health_timeout: 120             # 拉起后等 server /health 就绪的最长秒数
  # health_path: /health

  # 以下仅 runtime: docker 生效(local 模式忽略):
  build_timeout: 600              # 单次 docker build 超时(秒);首次构建含拉基础镜像 + 装依赖,给足余量
  docker_memory: 4g               # 容器内存上限(防滥用熔断:防单个镜像吃满评测机内存)
  docker_cpus: "2"                # 容器 CPU 上限
  docker_pids_limit: 512          # 容器进程数上限(防 fork 炸弹)
  # docker_run_as_root: false     # 默认非 root 运行;个别镜像必须 root 才能跑时置 true
  # 注:model 调用次数/token 不做框架侧硬配额——凭证直连我方后端、框架不中转,无计数抓手;
  #     防滥用靠上面的资源上限 + predict_timeout,真要限调用数须在 model 后端侧限流。
  # TODO(安全收紧):第一版容器走默认桥接网络(需连 model 后端);后续改出口白名单堵数据外传。

# 评测阶段:
#   predict   只生成预测
#   metric    只判分聚合(复用最新 exp 目录)
#   visualize 只按 metrics.json 出图到 figures/<数据集>/<模型>/(复用最新 exp 目录)
#   all       预测 + 判分 + 出图(端到端)
stage: all

# 批量评测的数据集列表。agent 逐条答题,判分/指标全部复用现有流水线,
# 因此成绩可与非 agent 模型横向对比。完整说明见 docs/datasets.md
datasets:
  - Belief_R
  - BigToM
  - EmoBench
  - ExploreToM
  - FanToM
  - FictionalQA
  - HellaSwag
  - HiToM
  - PUB
  - SimpleToM
  - SocialBench
  - SocialIQA
  - SocialMind
  - TactfulToM
  - ToMBench
  - ToMChallenges
  - ToMQA
  - ToMato
  - ToMi

max_samples: 40
normalized_datasets_path: datasets
results_path: results          # 预测/判分结果根目录:results/<数据集>/<模型>/exp_<时间戳>/
figures_path: figures          # visualize 阶段出图根目录:figures/<数据集>/<模型>/
