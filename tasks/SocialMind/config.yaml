dataset: SocialMind
path: SocialMind/test

# open 题(Q4)判分模式：rubric —— 数据集自带 rubric prompt + judge model 打总分。
# 可选 f1 | llm_simple | rubric，详见 src/evaluation/open_judge.py。
open_judge: rubric

# Q4 开放分析题的通过阈值：judge 总分(0-max_score)平均 >= 该值 记为正确。
open_threshold: 7.0

# rubric 模式参数：每道 Q4 按其三级维度(meta.dim)取专属评分 prompt。
rubric:
  prompts_file: q4_judge_prompts.json   # 相对本目录；{dim_id: {prompt}} 映射
  key_field: dim                         # 用 meta.dim 选 per-key prompt
  max_score: 10                          # 总分量程(D1-D5 各 0-2)

# ============================================================
# LLM judge 配置（SocialMind 是目前唯一需要 LLM judge 的数据集）。
# judge 参数全部在此声明，experiment_config.yaml 不再管理 judge model。
# 采样参数(temperature/top_p/max_tokens 等)留空则用客户端默认值。
# ============================================================

# judge1：主 judge（必填）。
judge1:
  model_name: qwen3-8b
  api_key: <YOUR_API_KEY>
  api_url: https://api.tokenkey.dev/v1
  max_workers: 16
  # 该 API 端点的非流式调用强制要求 enable_thinking=false（否则 400）；
  # 不写则 from_config 默认 True，build_extra_body 不会下发该参数，导致 judge 全部 BadRequest。
  enable_thinking: false
  # 该端点 max_tokens 上限为 8192，from_config 默认 32768 会被拒（400）；rubric 只输出短 JSON，2048 足够。
  max_tokens: 2048

# judge2：可选第二 judge。填写后 Q4 由两个 judge 分别打分取平均
# （忠实 socmind-bench 的双 judge 协议）；缺省则只用 judge1。
# judge2:
#   model_name: qwen3.5-flash
#   api_key: sk-xxx
#   api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#   max_workers: 16
