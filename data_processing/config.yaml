# Data Processing Configuration — 合成数据流水线
# 流程：bad case 加载 → 维度诊断 → 数据合成 → LSH 守门员 → 难度验证

# ── 合成模型（DashScope deepseek-v4-flash，诊断 + 生成用）────────────────────
synthesis_model:
  api_url: xxx
  api_key: xxx
  model_name: deepseek-v4-flash
  temperature: 0.8
  max_tokens: 32768
  max_workers: 16
  enable_thinking: false
  system_prompt: ""
  request_interval_seconds: 0.5    # 每两次请求提交之间的最小间隔（秒），避免触发 rate limit

# ── 路径配置 ─────────────────────────────────────────────────────────────────
output_path: data_output
# ToMEval 评估结果根目录，布局：<predictions_root>/<dataset>/<model>/exp_<tag>/prediction.jsonl
predictions_root: results

# ── 守门员配置 ────────────────────────────────────────────────────────────────
leakage_guard:
  test_root: ../ToMSynth/test_data       # 相对于 ToMEval/ 目录
  threshold: 0.6
  num_perm: 128
  ngram: 4

# ── 合成参数 ─────────────────────────────────────────────────────────────────
synthesis:
  samples_per_batch: 5            # 每批 K 条 bad case 用于诊断
  max_retries_per_diagnosis: 3    # 生成失败时最多重试次数
  # 跨数据集配额（按 bad case 占比自动分配到各数据集）
  total_reports_budget: 500       # 所有数据集的诊断报告总配额（Stage 2）
  total_samples_budget: 10000     # 所有数据集的合成样本总配额（Stage 3，目标 5000 条硬样本）

# ── 数据集列表 ───────────────────────────────────────────────────────────────
# 每个数据集指定参与 bad case 分析的模型和对应的 exp 标签。
# models: 与 ToMEval 实验的 llm.model_name 一致（必填）
# exp:    对应的 exp_<tag>（不填则自动取最新 exp_*）
synthesis_datasets:
  - name: ToMBench
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~          # ~ 表示自动取最新
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: BigToM
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: SocialIQA
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: EmoBench
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: FanToM
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: HiToM
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~
  - name: SimpleToM
    models:
      - name: HardToM_GRPO_synthetic_20260515_hf
        exp: ~
      - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
        exp: ~

# ── 难度验证（合成数据必须让弱模型至少错 1 次，通过 LSH 后再跑）──────────────
difficulty_filter:
  enabled: true
  api_url: xxx
  api_key: xxx
  model_name: qwen3-8b
  temperature: 0.6
  max_tokens: 4096
  max_workers: 16
  enable_thinking: false
  system_prompt: ""
  request_interval_seconds: 0.5   # 限速，避免 429
  repeats: 1                      # 推理 1 次，答对则丢弃（SimpleToM/SocialIQA 类简单题不被过杀）
  keep_when_api_fail: false       # API 全部失败的样本不能确认难度，默认丢弃
