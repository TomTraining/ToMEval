# filter 评估模块配置（V3 数据飞轮）

# ── 数据集配置 ────────────────────────────────────────────────────────────────
datasets:
  - BigToM
  # - EmoBench
  # - FanToM
  # - HiToM
  # - SocialIQA
  # - ToMBench

# ── 模型配置 ──────────────────────────────────────────────────────────────────
# strong: 强模型，用于 answerability 判断和 repair
# simple: 弱模型，用于 pass@k 评估
models:
  strong:
    api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: <YOUR_API_KEY>
    model_name: deepseek-v4-flash
    max_workers: 2
    temperature: 0.6
    max_tokens: 8192
  simple:
    api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: <YOUR_API_KEY>
    model_name: qwen3-8b
    max_workers: 2
    temperature: 0.6
    max_tokens: 8192

# ── 数据路径 ──────────────────────────────────────────────────────────────────
paths:
  # 输入：待评估数据根目录，期望结构 {input_root}/{dataset}/synthetic.parquet
  input_root: train_datasets
  # 输出：评估结果根目录，输出结构 {output_root}/{dataset}/eval_iter{N}/...
  output_root: filter_output

# ── 采样控制（可选）──────────────────────────────────────────────────────────
# 默认全量评估；如果数据量大可以开启采样
sampling:
  enabled: true           # true=采样，false=全量
  max_samples: 10         # 每个数据集最多评估多少条（仅当 enabled=true 时生效）

# ── pass@k 评估 ───────────────────────────────────────────────────────────────
pass_k: 3                 # 弱模型 pass@k 的 trial 次数

# ── shortcut 探测 ─────────────────────────────────────────────────────────────
shortcut_k: 3             # shortcut 三维探测每维的 trial 次数

# ── open 题判分 ───────────────────────────────────────────────────────────────
# open（开放题，无选项）在 pass@k 与 shortcut/no_options 维度统一用 F1 判分：
# 模型输出与任一参考答案的 F1 >= 该阈值即判对（中文按字、英文按词，复用 eval 侧 open_judge.f1）。
open_f1_threshold: 0.5

# ── 各阶段开关 ────────────────────────────────────────────────────────────────
passk_enabled: true          # false = 跳过难度分桶，所有样本按 partial 走可回答性/shortcut（失去 easy/hard）
answerability_enabled: true  # false = 跳过可回答性；优雅降级：假设全部可回答
shortcut_enabled: true       # false = 跳过 shortcut；优雅降级：假设全部非 shortcut

# ── 修复开关 ──────────────────────────────────────────────────────────────────
repair_enabled: true      # false = 只跑单轮评估打标，不修复 / 不迭代 / 不标 unfixable

# ── 修复迭代控制 ──────────────────────────────────────────────────────────────
max_iter: 2               # 修复迭代上限（含第一轮）；超过仍未修好 → unfixable
