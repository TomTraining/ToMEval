# Data Processing Configuration — 合成数据流水线
# 流程：bad case 加载 → 维度诊断 → 数据合成 → LSH 守门员

# ── 运行控制 ──────────────────────────────────────────────────────────────────
stage: all            # all / load / diagnose / synth / dedupe
max_bad_cases: 0      # 每数据集最多 bad case 数（0=不限）

# ── 合成模型（DashScope deepseek-v4-flash，诊断 + 生成用）────────────────────
synthesis_model:
  api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: <YOUR_API_KEY>
  model_name: deepseek-v4-flash
  temperature: 0.6
  max_tokens: 32768
  max_workers: 16
  enable_thinking: false
  system_prompt: ""
  request_interval_seconds: 1    # 每两次请求提交之间的最小间隔（秒），避免触发 rate limit

# ── 路径配置 ─────────────────────────────────────────────────────────────────
output_path: feedback_output
# ToMEval 评估结果根目录，布局：<predictions_root>/<dataset>/<model>/exp_<tag>/prediction.jsonl
predictions_root: results

# ── 守门员配置 ────────────────────────────────────────────────────────────────
leakage_guard:
  test_root: ./datasets       # 相对于 ToMEval/ 目录
  threshold: 0.6              # 与测试集的 Jaccard 相似度阈值
  internal_threshold: 0.85    # 内部去重阈值（合成样本之间）
  num_perm: 128
  ngram: 4

# ── 合成参数 ─────────────────────────────────────────────────────────────────
synthesis:
  max_retries_per_diagnosis: 3    # 生成失败时最多重试次数
  bad_cases_per_report: 1         # 每个诊断报告输入几条 bad case（越多报告越综合，越少越针对单条）
  diagnosis_batch_size: 10        # stage2 每批诊断报告数，完成后立即写盘
  synthesis_batch_size: 20        # stage3 每批合成数据数，完成后立即写盘

# ── 数据集列表 ───────────────────────────────────────────────────────────────
# 每个数据集指定：
#   - models: 参与 bad case 分析的模型（与 ToMEval 实验的 llm.model_name 一致）
#   - exp: 对应的 exp_<tag>（~ 表示自动取最新 exp_*）
#   - target_samples: 目标合成数据量（如 50）
#   - samples_per_report: 每个诊断报告生成几条数据（如 5）
#   报告数 = target_samples / samples_per_report，按维度错误比例分配
synthesis_datasets:
  - name: HiToM
    target_samples: 50
    samples_per_report: 5
    models:
      - name: NewBase0528-8B-badcaseNseedGRPO-2epoch-0529NanJing
        exp: ~          # ~ 表示自动取最新
      # - name: HardToM_GRPO_synthetic_20260515_hf_3epoch
